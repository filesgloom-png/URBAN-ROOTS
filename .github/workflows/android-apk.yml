name: URBAN ROOTS Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: urban-roots-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: platform-tools

      - name: Install Android build tools
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Generate Android launcher icon PNGs
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          convert icon.svg -resize 192x192! -background none -alpha on -depth 8 PNG32:icon.png
          convert icon.svg -resize 432x432! -background none -alpha on -depth 8 PNG32:icon-foreground.png
          convert -size 432x432 xc:'#10251f' -alpha on -depth 8 PNG32:icon-background.png
          file icon.png icon-foreground.png icon-background.png
          identify -format "%f: %wx%h PNG\n" icon.png icon-foreground.png icon-background.png
          for image in icon.png icon-foreground.png icon-background.png; do
            identify -format "%f: depth=%z channels=%[channels]\n" "$image"
            test "$(identify -format "%z" "$image")" = "8"
          done
          test -s icon.png
          test -s icon-foreground.png
          test -s icon-background.png

      - name: Install Godot 4.5.1
        run: |
          mkdir -p "$HOME/godot" "$HOME/.local/share/godot/export_templates/4.5.1.stable"
          wget -q https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d "$HOME/godot"
          sudo install -m 0755 "$HOME/godot/Godot_v4.5.1-stable_linux.x86_64" /usr/local/bin/godot
          wget -q https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_export_templates.tpz -O /tmp/godot-templates.tpz
          unzip -q /tmp/godot-templates.tpz -d /tmp/godot-templates
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.5.1.stable/"
          godot --version

      - name: Import project assets before Android export
        run: |
          echo "=== Generated launcher PNG files ==="
          identify -format "%f: %wx%h PNG\n" icon.png icon-foreground.png icon-background.png
          test -s icon.png
          test -s icon-foreground.png
          test -s icon-background.png
          godot --headless --editor --path . --import --quit
          echo "=== Confirm imported launcher resources ==="
          find .godot/imported -maxdepth 1 -type f -printf "%f\\n" | sort | head -n 40

      - name: Configure Godot Android export paths
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.5.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
          echo "=== Verify Godot 4.5 loaded settings file ==="
          ls -l "$HOME/.config/godot/editor_settings-4.5.tres"
          grep -E 'export/android/(android_sdk_path|java_sdk_path)' "$HOME/.config/godot/editor_settings-4.5.tres"

      - name: Validate project scripts
        run: |
          godot --headless --path . --editor --quit

      - name: Run headless gameplay smoke test
        run: godot --headless --path . --quit-after 3

      - name: Prepare Android debug keystore
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" -noprompt
          sed -i "s|export/android/debug_keystore = .*|export/android/debug_keystore = \"$HOME/.android/debug.keystore\"|" "$HOME/.config/godot/editor_settings-4.5.tres"
          sed -i "s|export/android/debug_keystore_pass = .*|export/android/debug_keystore_pass = \"android\"|" "$HOME/.config/godot/editor_settings-4.5.tres"
          grep -E "export/android/debug_keystore(_pass)? =" "$HOME/.config/godot/editor_settings-4.5.tres"
          test -s "$HOME/.android/debug.keystore"
          sed -i 's|keystore/debug=""|keystore/debug="/home/runner/.android/debug.keystore"|' export_presets.cfg
          sed -i 's|keystore/debug_user=""|keystore/debug_user="androiddebugkey"|' export_presets.cfg
          sed -i 's|keystore/debug_password=""|keystore/debug_password="android"|' export_presets.cfg

      - name: Diagnose Android export configuration
        run: |
          echo "=== Effective Android preset settings ==="
          cat export_presets.cfg
          echo "=== Godot Android editor settings ==="
          cat "$HOME/.config/godot/editor_settings-4.5.tres"
          echo "=== Java and Android SDK ==="
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -ld "$JAVA_HOME" "$ANDROID_HOME" "$ANDROID_HOME/platform-tools" "$ANDROID_HOME/platforms/android-35" "$ANDROID_HOME/build-tools/35.0.0"
          echo "=== Export template required files ==="
          ls -lah "$HOME/.local/share/godot/export_templates/4.5.1.stable/"
          test -s "$HOME/.local/share/godot/export_templates/4.5.1.stable/android_debug.apk"
          test -s "$HOME/.local/share/godot/export_templates/4.5.1.stable/android_release.apk"
          test -s "$HOME/.local/share/godot/export_templates/4.5.1.stable/android_source.zip"
          echo "=== Imported resources ==="
          find .godot/imported -maxdepth 1 -type f -printf "%f %s bytes\\n" | sort
          echo "=== Godot editor diagnostic ==="
          godot --headless --verbose --path . --editor --quit 2>&1 | tee /tmp/godot-editor-check.log
          echo "=== Verify required project files ==="
          test -s scenes/main.tscn
          test -s icon.png
          test -s icon-foreground.png
          test -s icon-background.png
      - name: Export Android debug APK
        run: |
          mkdir -p build
          echo "=== Android SDK manager and Gradle diagnostics ==="
          find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -print
          find "$ANDROID_HOME/build-tools/35.0.0" -maxdepth 1 -type f -printf "%f\\n" | sort | head -n 80
          command -v gradle || true
          echo "=== Export with Godot editor verbose logging ==="
          godot --headless --verbose --editor --path . --quit 2>&1 | tee /tmp/godot-export-precheck.log
          echo "=== Export APK ==="
          godot --headless --verbose --path . --export-debug "Android" build/URBAN-ROOTS-debug.apk 2>&1 | tee /tmp/godot-android-export.log

      - name: Verify APK
        run: |
          test -s build/URBAN-ROOTS-debug.apk
          file build/URBAN-ROOTS-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging build/URBAN-ROOTS-debug.apk | head -n 8

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: URBAN-ROOTS-debug
          path: build/URBAN-ROOTS-debug.apk
          if-no-files-found: error
          retention-days: 14
